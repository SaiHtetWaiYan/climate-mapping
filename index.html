<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Climate Mapping - township climate hazard projections for Myanmar" />
        <!-- Link previews (Open Graph / Twitter). Image built by scripts/build_og_image.py -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Climate Mapping" />
        <meta property="og:title" content="Climate Mapping" />
        <meta property="og:description" content="Township climate hazard projections for Myanmar: extreme heat, humid heat and drought under two emissions scenarios." />
        <meta property="og:url" content="%VITE_SITE_URL%/" />
        <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Map of Myanmar townships coloured by projected days above 40°C" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Climate Mapping" />
        <meta name="twitter:description" content="Township climate hazard projections for Myanmar: extreme heat, humid heat and drought under two emissions scenarios." />
        <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
        <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
        <link rel="manifest" href="/manifest.json" />
        <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
        <title>Climate Mapping</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/indexSimple.jsx"></script>
